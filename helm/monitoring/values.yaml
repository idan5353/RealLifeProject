# ── Grafana ───────────────────────────────────────────────────────────────────
grafana:
  enabled: true
  adminPassword: "admin123"   # change this

  persistence:
    enabled: true
    size: 2Gi

  service:
    type: ClusterIP

  # Pre-load custom dashboards
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: custom
          orgId: 1
          folder: "Task Platform"
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/custom

  dashboards:
    custom:
      task-platform-overview:
        json: |
          {
            "title": "Task Platform Overview",
            "uid": "task-platform",
            "panels": [
              {
                "title": "HTTP Request Rate",
                "type": "graph",
                "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
                "targets": [{
                  "expr": "sum(rate(http_requests_total{namespace=\"dev\"}[5m])) by (pod)",
                  "legendFormat": "{{pod}}"
                }]
              },
              {
                "title": "Pod CPU Usage",
                "type": "graph",
                "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
                "targets": [{
                  "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"dev\",container!=\"\"}[5m])) by (pod)",
                  "legendFormat": "{{pod}}"
                }]
              },
              {
                "title": "Pod Memory Usage",
                "type": "graph",
                "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
                "targets": [{
                  "expr": "sum(container_memory_working_set_bytes{namespace=\"dev\",container!=\"\"}) by (pod)",
                  "legendFormat": "{{pod}}"
                }]
              },
              {
                "title": "Pod Restarts",
                "type": "stat",
                "gridPos": { "h": 4, "w": 12, "x": 12, "y": 8 },
                "targets": [{
                  "expr": "sum(kube_pod_container_status_restarts_total{namespace=\"dev\"}) by (pod)",
                  "legendFormat": "{{pod}}"
                }]
              }
            ],
            "schemaVersion": 16,
            "version": 1
          }

  # Import community dashboards by ID
  dashboards:
    default:
      kubernetes-cluster:
        gnetId: 7249       # Kubernetes Cluster Overview
        revision: 1
        datasource: Prometheus
      node-exporter:
        gnetId: 1860       # Node Exporter Full
        revision: 31
        datasource: Prometheus
      kubernetes-pods:
        gnetId: 6781       # Kubernetes Pod Metrics
        revision: 1
        datasource: Prometheus

# ── Prometheus ────────────────────────────────────────────────────────────────
prometheus:
  enabled: true

  prometheusSpec:
    retention: 7d          # keep 7 days of metrics — saves disk
    retentionSize: "5GB"

    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

    # Scrape your app namespace
    additionalScrapeConfigs:
      - job_name: 'task-platform-backend'
        static_configs:
          - targets: ['backend-service.dev.svc.cluster.local:5000']
        metrics_path: '/metrics'
        scrape_interval: 15s

    # Watch all namespaces for ServiceMonitors
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

  service:
    type: ClusterIP

# ── Alertmanager ──────────────────────────────────────────────────────────────
alertmanager:
  enabled: true

  config:
    global:
      resolve_timeout: 5m

    route:
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'slack-notifications'
      routes:
        - match:
            severity: critical
          receiver: 'slack-notifications'
        - match:
            severity: warning
          receiver: 'slack-notifications'

    receivers:
      - name: 'slack-notifications'
        slack_configs:
          - api_url: 'YOUR_SLACK_WEBHOOK_URL'   # replace with real webhook
            channel: '#alerts'
            send_resolved: true
            title: '{{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }} {{ .CommonLabels.alertname }}'
            text: |
              *Severity:* {{ .CommonLabels.severity }}
              *Namespace:* {{ .CommonLabels.namespace }}
              *Description:* {{ range .Alerts }}{{ .Annotations.description }}{{ end }}

  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

# ── Node Exporter ─────────────────────────────────────────────────────────────
nodeExporter:
  enabled: true

# ── kube-state-metrics ────────────────────────────────────────────────────────
kubeStateMetrics:
  enabled: true

# ── Default Alert Rules ───────────────────────────────────────────────────────
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false          # not exposed in EKS managed control plane
    configReloaders: true
    general: true
    kubeApiserverAvailability: true
    kubeApiserverBurnrate: true
    kubeApiserverHistogram: true
    kubeApiserverSlas: true
    kubeControllerManager: false   # not exposed in EKS
    kubelet: true
    kubeProxy: false               # not exposed in EKS
    kubeSchedulerAlerting: false   # not exposed in EKS
    kubeStateMetrics: true
    kubernetes: true
    node: true
    nodeExporterAlerting: true
    prometheus: true
    prometheusOperator: true
