apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: task-platform-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack   # must match Helm release name
spec:
  groups:
    - name: task-platform.rules
      interval: 30s
      rules:

        # Pod crash looping
        - alert: PodCrashLooping
          expr: |
            rate(kube_pod_container_status_restarts_total{namespace="dev"}[15m]) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is crash looping"
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has restarted more than once in 15 minutes"

        # Pod not ready
        - alert: PodNotReady
          expr: |
            kube_pod_status_ready{namespace="dev", condition="true"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is not ready"
            description: "Pod {{ $labels.pod }} has been not ready for 5 minutes"

        # High CPU
        - alert: HighCPUUsage
          expr: |
            sum(rate(container_cpu_usage_seconds_total{namespace="dev",container!=""}[5m])) by (pod)
            / sum(kube_pod_container_resource_limits{namespace="dev",resource="cpu"}) by (pod)
            > 0.8
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High CPU on pod {{ $labels.pod }}"
            description: "Pod {{ $labels.pod }} CPU usage is above 80% for 10 minutes"

        # High Memory
        - alert: HighMemoryUsage
          expr: |
            sum(container_memory_working_set_bytes{namespace="dev",container!=""}) by (pod)
            / sum(kube_pod_container_resource_limits{namespace="dev",resource="memory"}) by (pod)
            > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High memory on pod {{ $labels.pod }}"
            description: "Pod {{ $labels.pod }} memory usage is above 85% for 10 minutes"

        # Backend down
        - alert: BackendDown
          expr: |
            kube_deployment_status_replicas_available{namespace="dev", deployment="backend"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Backend deployment is down"
            description: "No backend replicas are available in the dev namespace"

        # HPA at max replicas
        - alert: HPAAtMaxReplicas
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas{namespace="dev"}
            >= kube_horizontalpodautoscaler_spec_max_replicas{namespace="dev"}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "HPA {{ $labels.horizontalpodautoscaler }} at max replicas"
            description: "HPA has been at max replicas for 15 minutes — consider increasing limits"
